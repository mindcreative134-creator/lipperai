name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android APK
        working-directory: ./mobile_app
        run: flutter build apk --release

      - name: Prepare APK for Release
        run: |
          mkdir -p release_output
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk release_output/ClipperAI-v1.0.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipperAI-Release-APK
          path: release_output/ClipperAI-v1.0.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: ClipperAI v1.0.1 (100% On-Device Standalone Release)
          draft: false
          prerelease: false
          body: |
            ## 🎉 ClipperAI v1.0.1 - 100% On-Device Standalone Mode

            ### 🚀 What's New:
            - **⚡ 100% On-Device Mode (Zero External PC/Backend Required)**: Works directly out-of-the-box on your Android phone without needing `app.py` or any local server!
            - **🎬 Interactive 9:16 Reel Player**: Fullscreen player with live word-by-word bouncing animated captions (Viral Hormozi Yellow, Clean Minimal, Neon Cyber, Breaking Box).
            - **💾 SQLite Local Storage**: Generated clips and metadata saved persistently on device.
            - **▶️ Direct YouTube Timestamp Jumper**: Tap to jump right into YouTube at the exact highlight second!
            - **⚙️ Configurable Server Settings**: Optional switch between On-Device and PC Server mode.

            ### 📲 Download:
            Download **`ClipperAI-v1.0.1.apk`** below to install!
          files: release_output/ClipperAI-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
