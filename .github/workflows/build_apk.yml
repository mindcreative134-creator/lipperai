name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android APK
        working-directory: ./mobile_app
        run: flutter build apk --release

      - name: Prepare APK for Release
        run: |
          mkdir -p release_output
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk release_output/ClipperAI-v1.0.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipperAI-Release-APK
          path: release_output/ClipperAI-v1.0.2.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: ClipperAI v1.0.2 (Stitch UI/UX & Fast Clip Release)
          draft: false
          prerelease: false
          body: |
            ## 🎨 ClipperAI v1.0.2 - Stitch UI/UX Redesign & High-Speed Clipping

            ### 🚀 What's New:
            - **✨ StitchMCP Cyber-Dark UI/UX**: Re-engineered with modern Stitch design palette (Deep Slate `#0F1117`, Electric Yellow `#FACC15`, Neon Cyan `#06B6D4`).
            - **📋 One-Tap URL Paste**: Quick clipboard paste button built directly into the input bar.
            - **⚡ Fast-Engine Video Pipeline**: Resolved video download bottleneck (switched to 720p 60fps high-throughput stream with android/web client fallback).
            - **🌐 Smart Cloud / On-Device Dual Fallback**: Automatically connects to cloud backend, and seamlessly falls back to 100% on-device mode if offline with ZERO crashes.
            - **🎬 9:16 Viral Reel Player**: Word-by-word animated bouncing subtitles with direct YouTube timestamp opening.

            ### 📲 Download:
            Download **`ClipperAI-v1.0.2.apk`** below to install!
          files: release_output/ClipperAI-v1.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
