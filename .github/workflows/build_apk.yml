name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android APK
        working-directory: ./mobile_app
        run: flutter build apk --release

      - name: Prepare APK for Release
        run: |
          mkdir -p release_output
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk release_output/ClipperAI-v1.0.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipperAI-Release-APK
          path: release_output/ClipperAI-v1.0.3.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: ClipperAI v1.0.3 (Klap.app Viral Score, Smart Reframe 2 & Kinetic Subtitles)
          draft: false
          prerelease: false
          body: |
            ## 🚀 ClipperAI v1.0.3 - Full Klap.app AI Replication (100% Free & Open-Source)

            ### 🔥 What's New:
            - **🧠 Klap AI Viral Score (0-100)**: Evaluates opening 15s hook, dialogue velocity (words/sec), and sound energy to rank clips (e.g. `98/100 Viral Sensation 🔥`).
            - **🎯 AI Reframe 2 (Speaker Center Crop)**: 9:16 vertical crop locked directly onto active speaker rather than blurry letterboxes.
            - **⚡ Kinetic Captions + Auto-Emojis**: Electric Yellow `#FACC15` pop with automatic context emojis (💰, 🤯, 🔥, 🤫, 😂, 🛑, 🏆, ❤️).
            - **🎥 Real Video Player Integration**: Powered by Flutter's official `video_player` with stream playback, loop, scrubber, and direct YouTube app deep-linking.
            - **📱 100% On-Device / Cloud Studio Switcher**: Run completely offline without any backend server ("⚡ 100% On-Device"), or connect seamlessly to Cloud AI Studio.
            - **🛠️ Fixed AndroidManifest XML Error**: Fixed unescaped character issue that interrupted earlier build runs.

            ### 📲 Direct Download:
            Download **`ClipperAI-v1.0.3.apk`** below to install!
          files: release_output/ClipperAI-v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
